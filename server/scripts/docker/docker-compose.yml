# HEI 全栈：MySQL + Redis + MinIO + hei-boot + hei-admin + hei-portal
# 镜像从 registry.cn-beijing.aliyuncs.com/czbyte 拉取，Compose 不包含 build。
# cp .env.example .env && docker compose up -d
services:
  mysql:
    image: ${MYSQL_IMAGE:-registry.cn-beijing.aliyuncs.com/czbyte/mysql:9.6.0}
    container_name: hei-mysql
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hei_boot}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - hei-mysql-data:/var/lib/mysql
      - ../hei_boot.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../oj_p0.sql:/docker-entrypoint-initdb.d/02-oj-p0.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - hei-net

  redis:
    image: ${REDIS_IMAGE:-registry.cn-beijing.aliyuncs.com/czbyte/redis:8.6.2}
    container_name: hei-redis
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/conf/redis.conf:/redis/config/redis.conf:ro
      - hei-redis-data:/redis/data
    command:
      - sh
      - -c
      - redis-server /redis/config/redis.conf --requirepass "$$REDIS_PASSWORD"
    restart: unless-stopped
    networks:
      - hei-net

  minio:
    image: ${MINIO_IMAGE:-registry.cn-beijing.aliyuncs.com/czbyte/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1}
    container_name: hei-minio
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - hei-minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - hei-net

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    container_name: hei-rabbitmq
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hei}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hei123456}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - hei-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - hei-net

  hei-boot:
    image: registry.cn-beijing.aliyuncs.com/czbyte/hei-boot:${HEI_BOOT_VERSION:-latest}
    container_name: hei-boot
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SERVER_PORT: ${SERVER_PORT:-8000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_WRITE_URL: ${DB_WRITE_URL:?set DB_WRITE_URL in .env}
      DB_WRITE_USERNAME: ${DB_WRITE_USERNAME:-root}
      DB_WRITE_PASSWORD: ${DB_WRITE_PASSWORD:?set DB_WRITE_PASSWORD in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-hei}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-hei123456}
      OJ_JUDGE_DEFAULT_SIGNING_SECRET: ${OJ_JUDGE_DEFAULT_SIGNING_SECRET:-}
      HEI_CONFIG_CRYPTO_KEY: ${HEI_CONFIG_CRYPTO_KEY:?set HEI_CONFIG_CRYPTO_KEY in .env}
      SA_TOKEN_COOKIE_SECURE: ${SA_TOKEN_COOKIE_SECURE:-false}
      HEI_SECURITY_EXPOSE_ACTUATOR: ${HEI_SECURITY_EXPOSE_ACTUATOR:-true}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - hei-boot-logs:/app/logs
      - hei-boot-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT:-8000}/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - hei-net

  hei-admin:
    image: registry.cn-beijing.aliyuncs.com/czbyte/hei-admin:${HEI_ADMIN_VERSION:-latest}
    container_name: hei-admin
    env_file: .env
    depends_on:
      hei-boot:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      BACKEND_HOST: hei-boot
      BACKEND_PORT: ${SERVER_PORT:-8000}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
      # nginx 模板变量；缺失时 envsubst 不替换，会导致 nginx 启动失败
      CONTENT_SECURITY_POLICY: "${HEI_ADMIN_CONTENT_SECURITY_POLICY:-default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'}"
      HSTS_HEADER: ${HEI_HSTS_HEADER:-}
    ports:
      - "${HEI_ADMIN_PORT:-5173}:81"
    restart: unless-stopped
    networks:
      - hei-net

  hei-portal:
    image: registry.cn-beijing.aliyuncs.com/czbyte/hei-portal:${HEI_PORTAL_VERSION:-latest}
    container_name: hei-portal
    env_file: .env
    depends_on:
      hei-boot:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      BACKEND_HOST: hei-boot
      BACKEND_PORT: ${SERVER_PORT:-8000}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
      CONTENT_SECURITY_POLICY: "${HEI_PORTAL_CONTENT_SECURITY_POLICY:-default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'}"
      HSTS_HEADER: ${HEI_HSTS_HEADER:-}
    ports:
      - "${HEI_PORTAL_PORT:-5174}:80"
    restart: unless-stopped
    networks:
      - hei-net

networks:
  hei-net:
    driver: bridge

volumes:
  hei-mysql-data:
  hei-redis-data:
  hei-minio-data:
  hei-rabbitmq-data:
  hei-boot-logs:
  hei-boot-storage:
