# 将 ACOJ 五个应用镜像构建并推送到 GitHub Container Registry (ghcr.io)
name: Publish Docker images

on:
  push:
    branches: [jv_fixed]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "额外镜像标签（默认 latest；tag 推送时还会打上版本号）"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-system
            context: .
            file: service-system/Dockerfile
            image: acoj-service-system
          - name: service-judge
            context: ./service-judge
            file: service-judge/Dockerfile
            image: acoj-service-judge
            build_args: USE_CN_MIRROR=0
          - name: service-similarity
            context: ./service-similarity
            file: service-similarity/Dockerfile
            image: acoj-service-similarity
            build_args: USE_CN_MIRROR=0
          - name: pc
            context: ./app-pc
            file: app-pc/Dockerfile
            image: acoj-pc
            build_args: |
              VITE_GATEWAY=http://localhost:89
              NPM_REGISTRY=https://registry.npmjs.org
          - name: admin
            context: ./app-admin
            file: app-admin/Dockerfile
            image: acoj-admin
            build_args: |
              VITE_GATEWAY=http://localhost:89
              NPM_REGISTRY=https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/jv_fixed' }}
            type=raw,value=${{ inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
