server:
  port: 89

spring:
  application:
    name: service-system
  jackson:
    time-zone: Asia/Shanghai
    locale: en_US
  profiles:
    active: @profiles.active@
  # Nacos 连接与 spring.config.import 必须写在同一 profile 文件中（application-{profile}.yaml），
  # 否则 import 早于 profile 覆盖，会出现 serverAddr/namespace 为空、连到错误租户。

logging:
  level:
    org.dromara.trans.service.impl.SimpleTransService: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus  # 暴露 prometheus 端点
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: my-springboot-app  # 可选：给所有指标加标签
