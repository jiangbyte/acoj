oj:
  similarity:
    config:
      single-problem-library-size: 50
      single-set-problem-library-size: 50
      
      # 题目单提交检测配置
      problem-single-submit-batch-size: 100
      problem-single-submit-sensitivity: 5
      problem-single-submit-batch-end-size: 1
      
      # 题目集内单提交检测配置
      set-single-submit-batch-size: 100
      set-single-submit-sensitivity: 5
      
      # 自定义检测配置
      custom-detection-batch-size: 100
      custom-detection-sensitivity: 5
  llm:
    prompts:
      # 基础角色定义 - 所有专业角色的基础
      default-prompt: |
        You are "Xiao E", a programming problem-solving assistant for the AC OJ platform, dedicated to helping students understand and solve programming problems.
        Core Identity:
        - Identity: Professional OJ problem-solving assistant
        - Style: Friendly, approachable, professional, meticulous, and encouraging in teaching
        - Goal: Help students grasp the essence of problems, master problem-solving approaches, and improve programming skills
        Basic Principles:
        1. Always provide targeted guidance based on a specific problem ID. If no problem ID or problem text is present in the context, ask the user to provide it first.
        2. Keep explanations clear and easy to understand, avoiding excessive technical jargon.
        3. Be patient with beginners while providing in-depth analysis for experienced users.
        4. Encourage students to think independently rather than giving answers directly.
        5. Only respond to programming problem-related queries. For requests such as generating stories or writing unrelated content, politely decline and guide the user back to the programming problem-solving context.
        Please provide professional and accurate assistance based on the user's specific needs.
        
    external-knowledge-base:
      index-name: "astro-oj-knowledge"
  mq:
    judge:
      # 判题队列配置
      common:
        exchange: "common.judge.exchange"
        queue: "common.judge.queue"
        routing-key: "common.judge.routing"
      # 判题结果队列配置
      result:
        exchange: "common.judge.result.exchange"
        queue: "common.judge.result.queue"
        routing-key: "common.judge.result.routing"
    # 相似度计算队列配置
    similarity:
      single:
        exchange: "common.similarity.exchange"
        queue: "common.similarity.queue"
        routing-key: "common.similarity.routing"
      batch:
        exchange: "common.similarity.batch.exchange"
        queue: "common.similarity.batch.queue"
        routing-key: "common.similarity.batch.routing"
      common:
        exchange: "common.sim.exchange"
        queue: "common.sim.queue"
        routing-key: "common.sim.routing"
      result:
        exchange: "common.sim.result.exchange"
        queue: "common.sim.result.queue"
        routing-key: "common.sim.result.routing"
    # 代码库
    library:
      common:
        exchange: "common.library.exchange"
        queue: "common.library.queue"
        routing-key: "common.library.routing"
    
    solved:
      common:
        exchange: "common.solved.exchange"
        queue: "common.solved.queue"
        routing-key: "common.solved.routing"



