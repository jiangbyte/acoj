Name: service-judge
Host: 0.0.0.0
Port: 8888

# 注意：本文件供 Docker Compose 内网主机名（mysql/redis/rabbitmq）。
# 本机 make judge ENV=dev 使用的是远程 Nacos，应对齐 deploy/nacos-dev/DEFAULT_GROUP/service-judge.yaml（47.110.3.35）。
# 切勿把本 docker 模板直接发布到共享远程 Nacos，否则本机无法解析 rabbitmq。

# 工作空间
Workspace: "/tmp/judgespace"

# 沙箱：cgroup 资源限制 + 断网/降权 + 强制 bwrap 目录 jail + PID 上限
Sandbox:
  Mode: auto
  DisableNetwork: true
  DropPrivileges: true
  Uid: 65534
  Gid: 65534
  UseBwrap: "on"
  MaxPids: 64

# MySQL 配置
MySQL:
  Host: mysql:3306
  Username: root
  Password: "infra@123"
  Database: astro_code
  Charset: utf8mb4
  ParseTime: true
  Loc: Local
  MaxIdleConns: 10
  MaxOpenConns: 100
  ConnMaxLifetime: "1h"

Redis:
  Host: "redis:6379"
  Password: "infra@123"   # 与 redis.conf 的 requirepass 一致
  DB: 0
  PoolSize: 10

# RabbitMQ 配置
RabbitMQ:
  Host: "amqp://admin:infra%40123@rabbitmq:5672/"
  VirtualHost: "/"
  Common:
    JudgeExchange: "common.judge.exchange"
    JudgeQueue: "common.judge.queue"
    JudgeRoutingKey: "common.judge.routing"
    ResultExchange: "common.judge.result.exchange"
    ResultQueue: "common.judge.result.queue"
    ResultRoutingKey: "common.judge.result.routing"

# 语言配置
Languages:
  - name: "go"
    sourceFile: "main"
    compileFile: "main"
    extension: ".go"
    compileCmd: ["go", "build", "-o", "{exec}", "{source}"]
    runCmd: ["{exec}"]
    needCompile: true

  - name: "java"
    sourceFile: "Main"
    compileFile: "Main"
    extension: ".java"
    compileCmd: ["javac", "-d", "{exec}", "{source}"]
    runCmd: ["java", "-cp", "{exec}", "Main"]
    needCompile: true

  - name: "c"
    sourceFile: "main"
    compileFile: "main"
    extension: ".c"
    compileCmd: ["gcc", "{source}", "-o", "{exec}"]
    runCmd: ["{exec}"]
    needCompile: true

  - name: "cpp"
    sourceFile: "main"
    compileFile: "main"
    extension: ".cpp"
    compileCmd: ["g++", "{source}", "-o", "{exec}"]
    runCmd: ["{exec}"]
    needCompile: true

  - name: "python"
    sourceFile: "main"
    compileFile: "main"
    extension: ".py"
    compileCmd: []
    runCmd: ["python3", "{source}"]
    needCompile: false
